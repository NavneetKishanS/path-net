# Prototype v0 stack: Postgres + REST API (PostgREST) + seed loader + web dev server.
#   `bash run.sh up`      start everything      http://localhost:5173
#   `bash run.sh reset`   wipe the database and start clean
# The database schema in supabase/migrations/ runs only on a fresh volume (use `bash run.sh reset` after editing it).
name: pathnet

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pathnet
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pathnet"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    build: ./pipeline
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pathnet
      DATA_DIR: /data
    volumes:
      - ./pipeline:/app
      - ./data:/data
    command: python load_seed.py
    restart: "no"

  api:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/pathnet
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
    ports:
      - "3001:3000"

  web:
    image: node:22-alpine
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      api:
        condition: service_started
      seed:
        condition: service_completed_successfully
    environment:
      VITE_DATA_SOURCE: rest
      VITE_API_URL: http://localhost:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/app
      - web_node_modules:/app/web/node_modules
    ports:
      - "5173:5173"

volumes:
  pgdata:
  web_node_modules:
